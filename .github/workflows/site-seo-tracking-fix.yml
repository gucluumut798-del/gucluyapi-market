name: Guclu Yapi Site SEO and Tracking Fix

on:
  push:
    paths:
      - '.github/workflows/site-seo-tracking-fix.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild tracking cleanly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8', errors='ignore')

          GA_ID = 'G-52E1LMP010'
          ADS_ID = 'AW-17964334460'

          # Remove every existing Google gtag loader so we can install one clean copy.
          s = re.sub(
              r'<script\b[^>]*src=["\'][^"\']*googletagmanager\.com/gtag/js[^"\']*["\'][^>]*>\s*</script>',
              '', s, flags=re.I | re.S
          )

          # Remove old/broken inline tracking and AI-control blocks.
          script_re = re.compile(r'<script\b(?![^>]*\bsrc=)[^>]*>.*?</script>', re.I | re.S)
          def clean_script(m):
              block = m.group(0)
              low = block.lower()
              markers = [
                  GA_ID.lower(), ADS_ID.lower(),
                  'ads_conversion_contact', 'gytrackwhatsapp',
                  'gy-ai-diagnostic', 'gy-whatsapp-conversion',
                  'gy-contact-tracking', 'gy-google-base',
                  'gy-google-ads-base', 'gy-hide-ai-control',
                  'ai kontrol', 'kontrol=1'
              ]
              if any(x in low for x in markers):
                  return ''
              return block
          s = script_re.sub(clean_script, s)

          # Remove any leftover AI KONTROL button/label written directly in HTML.
          s = re.sub(
              r'<(?:button|a|div|span)\b[^>]*>\s*(?:🤖\s*)?AI\s*KONTROL\s*</(?:button|a|div|span)>',
              '', s, flags=re.I | re.S
          )

          # Keep high-intent local SEO wording.
          s = re.sub(
              r'<title>.*?</title>',
              '<title>İzmir Mantolama Ustası &amp; Dış Cephe Boya | GÜÇLÜ YAPI</title>',
              s, count=1, flags=re.I | re.S
          )
          s = re.sub(
              r'<meta\s+content="[^"]*"\s+name="description"\s*/?>',
              '<meta content="İzmir mantolama ustası, dış cephe boya ve tamirat hizmetleri. GÜÇLÜ YAPI; Menemen ve İzmir genelinde fileli sıva, dekoratif sıva ve izolasyon için ücretsiz keşif sunar." name="description"/>',
              s, count=1, flags=re.I
          )
          s = re.sub(
              r'<h1\b[^>]*>.*?</h1>',
              '<h1>İzmir Mantolama Ustası, Dış Cephe Boya ve Tamirat | <span>GÜÇLÜ YAPI</span></h1>',
              s, count=1, flags=re.I | re.S
          )

          # One canonical Google tag loader + GA4 + Google Ads destination.
          google_tag = f'''\n<!-- GÜÇLÜ YAPI - canonical Google tag -->\n<script async src="https://www.googletagmanager.com/gtag/js?id={GA_ID}"></script>\n<script id="gy-google-tag-v5">\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){{dataLayer.push(arguments);}}\n  window.gtag = gtag;\n  gtag('js', new Date());\n  gtag('config', '{GA_ID}', {{\n    send_page_view: true\n  }});\n  gtag('config', '{ADS_ID}');\n</script>\n'''

          if '</head>' in s.lower():
              pos = s.lower().rfind('</head>')
              s = s[:pos] + google_tag + s[pos:]
          else:
              s = google_tag + s

          # One canonical listener for WhatsApp and phone clicks.
          contact = '''\n<!-- GÜÇLÜ YAPI - contact conversion tracking -->\n<script id="gy-contact-tracking-v5">\n(function(){\n  'use strict';\n  if (window.__gyContactTrackingV5) return;\n  window.__gyContactTrackingV5 = true;\n\n  function sendEvent(name, params){\n    if (typeof window.gtag !== 'function') return;\n    window.gtag('event', name, Object.assign({transport_type:'beacon'}, params || {}));\n  }\n\n  document.addEventListener('click', function(event){\n    var link = event.target.closest ? event.target.closest('a[href]') : null;\n    if (!link) return;\n\n    var raw = link.getAttribute('href') || '';\n    var href = raw.toLowerCase();\n\n    if (href.indexOf('wa.me/') !== -1 ||\n        href.indexOf('api.whatsapp.com/') !== -1 ||\n        href.indexOf('web.whatsapp.com/') !== -1 ||\n        href.indexOf('whatsapp:') === 0) {\n      sendEvent('ads_conversion_contact', {\n        contact_method: 'whatsapp',\n        link_url: link.href || raw\n      });\n      return;\n    }\n\n    if (href.indexOf('tel:') === 0) {\n      sendEvent('phone_click', {\n        contact_method: 'phone',\n        link_url: raw\n      });\n    }\n  }, true);\n})();\n</script>\n'''

          # Remove the test query from the address bar and hide any late-injected old button.
          cleanup = '''\n<script id="gy-ui-cleanup-v5">\n(function(){\n  function clean(){\n    try {\n      var u = new URL(location.href);\n      if (u.searchParams.has('kontrol')) {\n        u.searchParams.delete('kontrol');\n        history.replaceState({}, '', u.pathname + (u.search ? u.search : '') + u.hash);\n      }\n    } catch(e) {}\n\n    document.querySelectorAll('button,a,[role="button"],div,span').forEach(function(el){\n      var t = (el.textContent || '').replace(/\\s+/g,' ').trim().toUpperCase();\n      if (t === 'AI KONTROL' || t === '🤖 AI KONTROL' || t === 'AI KONTROL V3' || t === '🤖 AI KONTROL V3') {\n        var x = el.closest('button,a,[role="button"]') || el;\n        x.remove();\n      }\n    });\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', clean, {once:true});\n  } else {\n    clean();\n  }\n  var mo = new MutationObserver(clean);\n  mo.observe(document.documentElement, {childList:true, subtree:true});\n  setTimeout(function(){ try { mo.disconnect(); } catch(e) {} }, 10000);\n})();\n</script>\n'''

          end = s.lower().rfind('</body>')
          inject = contact + cleanup
          if end >= 0:
              s = s[:end] + inject + s[end:]
          else:
              s += inject

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit site fix
        shell: bash
        run: |
          git config user.name "Guclu Yapi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Rebuild GA4 and Google Ads tracking cleanly"
            git push
          fi
