name: Add GA4 Only

on:
  push:
    paths:
      - '.github/workflows/add-ga4-only.yml'

permissions:
  contents: write

jobs:
  add-ga4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add only GA4 tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8', errors='ignore')
          ga = 'G-52E1LMP010'

          if ga in s:
              print('GA4 ID already exists; no site change made.')
          else:
              tag = '''\n<!-- GÜÇLÜ YAPI GA4 ONLY -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-52E1LMP010"></script>\n<script id="gy-ga4-only">\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag('js', new Date());\n  gtag('config', 'G-52E1LMP010');\n</script>\n<!-- /GÜÇLÜ YAPI GA4 ONLY -->\n'''
              lower = s.lower()
              pos = lower.find('</head>')
              if pos == -1:
                  raise SystemExit('ERROR: </head> not found; refusing to modify site.')
              s = s[:pos] + tag + s[pos:]
              path.write_text(s, encoding='utf-8')
              print('GA4 tag inserted before </head>.')
          PY

      - name: Verify GA4 is present
        shell: bash
        run: |
          grep -q 'G-52E1LMP010' index.html
          grep -q 'googletagmanager.com/gtag/js?id=G-52E1LMP010' index.html
          echo 'GA4 verification passed.'

      - name: Commit only index.html if changed
        shell: bash
        run: |
          git config user.name "Guclu Yapi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site change needed"
          else
            git commit -m "Add GA4 tracking only"
            git push
          fi
