name: Repair GA4 Placement

on:
  push:
    paths:
      - '.github/workflows/add-ga4-only.yml'

permissions:
  contents: write

jobs:
  repair-ga4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair only malformed GA4 placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8', errors='ignore')

          tag = '''<!-- GÜÇLÜ YAPI GA4 ONLY -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-52E1LMP010"></script>
          <script id="gy-ga4-only">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-52E1LMP010');
          </script>
          <!-- /GÜÇLÜ YAPI GA4 ONLY -->'''

          # Previous automated insertion accidentally split the first body div.
          # Repair exactly that malformed block and keep every other byte of the site untouched.
          bad = re.compile(
              r'<div id="gyScrollProgr\s*'
              r'<!-- GÜÇLÜ YAPI GA4 ONLY -->.*?'
              r'<!-- /GÜÇLÜ YAPI GA4 ONLY -->\s*'
              r'ess"></div>',
              re.S
          )

          repaired, count = bad.subn('<div id="gyScrollProgress"></div>\n' + tag, s, count=1)
          if count != 1:
              raise SystemExit(f'ERROR: expected exactly one malformed GA4 block, found {count}; refusing broad changes.')

          path.write_text(repaired, encoding='utf-8')
          print('Exact malformed block repaired. Site design/content otherwise untouched.')
          PY

      - name: Verify exact repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8', errors='ignore')
          assert '<div id="gyScrollProgress"></div>' in s
          assert 'googletagmanager.com/gtag/js?id=G-52E1LMP010' in s
          assert "gtag('config', 'G-52E1LMP010')" in s
          assert '<div id="gyScrollProgr\n<!-- GÜÇLÜ YAPI GA4 ONLY -->' not in s
          print('Repair verification passed.')
          PY

      - name: Commit repaired index only
        shell: bash
        run: |
          git config user.name "Guclu Yapi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Repair GA4 placement and stray page text"
          git push
