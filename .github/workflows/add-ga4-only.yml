name: Switch GA4 Stream

on:
  push:
    paths:
      - '.github/workflows/add-ga4-only.yml'

permissions:
  contents: write

jobs:
  switch-ga4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace only GA4 stream ID
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8', errors='ignore')

          old_id = 'G-52E1LMP010'
          new_id = 'G-NQMQZ571DX'

          block_re = re.compile(
              r'<!-- GÜÇLÜ YAPI GA4 ONLY -->.*?<!-- /GÜÇLÜ YAPI GA4 ONLY -->',
              re.S
          )
          m = block_re.search(s)
          if not m:
              raise SystemExit('ERROR: canonical GA4 block not found; refusing to modify anything else.')

          block = m.group(0)
          if old_id not in block:
              if new_id in block:
                  print('New GA4 stream ID already installed; no change needed.')
                  raise SystemExit(0)
              raise SystemExit('ERROR: expected old GA4 ID not found in canonical block; refusing broad changes.')

          new_block = block.replace(old_id, new_id)
          updated = s[:m.start()] + new_block + s[m.end():]
          path.write_text(updated, encoding='utf-8')
          print('GA4 stream switched inside canonical block only.')
          PY

      - name: Verify new GA4 tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8', errors='ignore')
          m = re.search(r'<!-- GÜÇLÜ YAPI GA4 ONLY -->.*?<!-- /GÜÇLÜ YAPI GA4 ONLY -->', s, re.S)
          assert m, 'GA4 block missing'
          block = m.group(0)
          assert 'googletagmanager.com/gtag/js?id=G-NQMQZ571DX' in block
          assert "gtag('config', 'G-NQMQZ571DX')" in block
          assert 'G-52E1LMP010' not in block
          print('New GA4 stream verification passed.')
          PY

      - name: Commit index only if changed
        shell: bash
        run: |
          git config user.name "Guclu Yapi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site change needed"
          else
            git commit -m "Switch GA4 to G-NQMQZ571DX"
            git push
          fi
