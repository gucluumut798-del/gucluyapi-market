name: Add WhatsApp Conversion Tracking

on:
  push:
    paths:
      - '.github/workflows/add-ga4-only.yml'

permissions:
  contents: write

jobs:
  add-contact-conversion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add only WhatsApp GA4 conversion event
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8', errors='ignore')

          ga_id = 'G-NQMQZ571DX'
          ga_end = '<!-- /GÜÇLÜ YAPI GA4 ONLY -->'
          marker = '<!-- GÜÇLÜ YAPI WHATSAPP CONVERSION V1 -->'

          if ga_id not in s:
              raise SystemExit('ERROR: new GA4 stream is not present; refusing to modify site.')

          if marker in s:
              print('WhatsApp conversion tracker already exists; no change needed.')
              raise SystemExit(0)

          pos = s.find(ga_end)
          if pos == -1:
              raise SystemExit('ERROR: canonical GA4 end marker not found; refusing broad changes.')
          pos += len(ga_end)

          block = r'''

<!-- GÜÇLÜ YAPI WHATSAPP CONVERSION V1 -->
<script id="gy-whatsapp-conversion-v1">
(function(){
  'use strict';
  if (window.__gyWhatsappConversionV1) return;
  window.__gyWhatsappConversionV1 = true;

  document.addEventListener('click', function(event){
    var link = event.target.closest ? event.target.closest('a[href]') : null;
    if (!link) return;

    var raw = (link.getAttribute('href') || '').trim();
    var href = raw.toLowerCase();
    var isWhatsapp =
      href.indexOf('wa.me/') !== -1 ||
      href.indexOf('api.whatsapp.com/') !== -1 ||
      href.indexOf('web.whatsapp.com/') !== -1 ||
      href.indexOf('whatsapp:') === 0;

    if (!isWhatsapp || typeof window.gtag !== 'function') return;

    window.gtag('event', 'ads_conversion_contact', {
      contact_method: 'whatsapp',
      link_url: link.href || raw,
      transport_type: 'beacon'
    });
  }, true);
})();
</script>
<!-- /GÜÇLÜ YAPI WHATSAPP CONVERSION V1 -->
'''

          s = s[:pos] + block + s[pos:]
          path.write_text(s, encoding='utf-8')
          print('WhatsApp conversion event tracker inserted after the canonical GA4 block only.')
          PY

      - name: Verify conversion tracker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8', errors='ignore')
          assert 'G-NQMQZ571DX' in s
          assert '<!-- GÜÇLÜ YAPI WHATSAPP CONVERSION V1 -->' in s
          assert "gtag('event', 'ads_conversion_contact'" in s
          assert "contact_method: 'whatsapp'" in s
          print('WhatsApp conversion tracker verification passed.')
          PY

      - name: Commit index only if changed
        shell: bash
        run: |
          git config user.name "Guclu Yapi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site change needed"
          else
            git commit -m "Track WhatsApp clicks as ads_conversion_contact"
            git push
          fi
