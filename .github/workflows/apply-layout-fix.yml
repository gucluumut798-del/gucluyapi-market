name: Apply safe layout fix

on:
  push:
    paths:
      - 'layout-fix.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link layout stylesheet safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          link = '<link rel="stylesheet" href="layout-fix.css?v=1">'
          pattern = r'<link rel="stylesheet" href="layout-fix\.css\?v=\d+">'

          if re.search(pattern, s):
              s = re.sub(pattern, link, s, count=1)
          else:
              if '</head>' not in s:
                  raise SystemExit('ERROR: </head> not found; refusing to edit')
              s = s.replace('</head>', link + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate site before commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'G-NQMQZ571DX',
              'ads_conversion_contact',
              'https://wa.me/905013242145',
              'class="hero-inner"',
              'layout-fix.css?v=1'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('REFUSING COMMIT; missing critical markers: ' + ', '.join(missing))
          print('Critical tracking and hero structure OK')
          PY

      - name: Commit stylesheet link only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No index.html change needed'
            exit 0
          fi
          git config user.name 'Güçlü Yapı Layout Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply safe responsive layout fix'
          git push
