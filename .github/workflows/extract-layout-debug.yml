name: Extract layout debug
on:
  push:
    paths:
      - '.github/workflows/extract-layout-debug.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract layout selectors and hero markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8', errors='ignore')
          lines=text.splitlines()
          keys=['.hero','hero-','class="hero','class=\'hero','max-width','page-shell','site-shell','container','wrapper','Uygulama Standartlarımız','42+ Yıllık Ustalık']
          hits=[]
          seen=set()
          for i,line in enumerate(lines):
              if any(k in line for k in keys):
                  a=max(0,i-4); b=min(len(lines),i+8)
                  key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  hits.append(f'--- lines {a+1}-{b} ---\n'+'\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
          Path('layout-debug.txt').write_text('\n\n'.join(hits[:160]),encoding='utf-8')
          PY
      - name: Commit debug extract
        run: |
          git config user.name "Güçlü Yapı Layout Debug"
          git config user.email "actions@users.noreply.github.com"
          git add layout-debug.txt
          git commit -m "Extract current layout rules for safe fix" || exit 0
          git push
