name: Remove AI Control Overlay

on:
  push:
    paths:
      - '.github/workflows/remove-ai-control.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove AI control overlay and query mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8', errors='ignore')

          marker = 'gy-disable-ai-control-v1'
          if marker not in s:
              patch = r'''
<!-- GÜÇLÜ YAPI: eski AI KONTROL test katmanını kapat -->
<script id="gy-disable-ai-control-v1">
(function(){
  'use strict';

  function cleanControlQuery(){
    try {
      var u = new URL(window.location.href);
      if (u.searchParams.has('kontrol')) {
        u.searchParams.delete('kontrol');
        var q = u.searchParams.toString();
        history.replaceState({}, '', u.pathname + (q ? '?' + q : '') + u.hash);
      }
    } catch(e) {}
  }

  function removeAiControl(){
    try {
      var selectors = [
        '[id*="ai-kontrol" i]',
        '[class*="ai-kontrol" i]',
        '[id*="ai-control" i]',
        '[class*="ai-control" i]',
        '[data-ai-control]'
      ].join(',');
      document.querySelectorAll(selectors).forEach(function(el){ el.remove(); });

      document.querySelectorAll('button, a, [role="button"], div, span').forEach(function(el){
        var txt = (el.textContent || '').replace(/\s+/g, ' ').trim().toUpperCase();
        if (txt === 'AI KONTROL' || txt === '🤖 AI KONTROL') {
          var target = el.closest('button, a, [role="button"]') || el;
          target.remove();
        }
      });
    } catch(e) {}
  }

  cleanControlQuery();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', removeAiControl, {once:true});
  } else {
    removeAiControl();
  }

  var observer = new MutationObserver(removeAiControl);
  observer.observe(document.documentElement, {childList:true, subtree:true});
  setTimeout(function(){ try { observer.disconnect(); } catch(e) {} }, 10000);
})();
</script>
'''
              idx = s.lower().rfind('</body>')
              if idx >= 0:
                  s = s[:idx] + patch + s[idx:]
              else:
                  s += patch
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Guclu Yapi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove leftover AI control overlay"
            git push
          fi
